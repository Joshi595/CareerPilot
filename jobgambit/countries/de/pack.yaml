# Germany pack. Conventions follow the job's country, not the person's.
name: Germany
languages: [de, en]
conventions:
  paper: a4
  photo: optional        # shown when the profile has a photo; common in Germany, never required
  dob: optional          # shown when the profile has it
  cv_pages: 2
  letter: formal         # DIN 5008-style: address block, place and date on the right
# Local names of job types (matched in titles, lower case); added to the worldwide rules.
job_types:
  student: [werkstudent, werkstudierend, studentische, studentische hilfskraft, hiwi]
  internship: [praktikum, praktikant, pflichtpraktikum]
  apprenticeship: [ausbildung, azubi, duales studium]
  thesis: [abschlussarbeit, masterarbeit, bachelorarbeit, thesis]
# Words searched in front of the person's titles and keywords for each job type they chose (with the worldwide ones).
search_words:
  student: [Werkstudent]
  internship: [Praktikum, Pflichtpraktikum]   # Pflichtpraktikum only for people who need a mandatory internship
  thesis: [Abschlussarbeit, Masterarbeit, Bachelorarbeit]   # narrowed by the thesis level they gave
  apprenticeship: [Ausbildung]
  graduate: [Trainee]
# A posting written in English that still demands fluent German (the language check also reads the posting's own language).
language_required:
  German: '(flie(ss|ß)end|verhandlungssicher|sehr gut| gut| sicher| solide|ausgezeichnet|exzellent|muttersprach| b2 | c1 )\w*(?:(?!plus|vorteil|wünschenswert|wuenschenswert|nice|desirable|prefer|advantag|benefic|basic|grundkenntnis|basis|optional)[\w\s]){0,40}(deutsch(kenntnis|sprach)\w*|deutsch(?= )|deutsche[nr]? sprache)(?![\w\s]{0,30}(von vorteil|wünschenswert|wuenschenswert|ein plus|nice to have|a plus|desirable|preferred))|(deutsch(kenntnis|sprach)\w*|deutsch(?= )|deutsche[nr]? sprache)(?:(?!plus|vorteil|wünschenswert|wuenschenswert|nice|desirable|prefer|advantag|benefic|basic|grundkenntnis|basis|optional)[\w\s]){0,30}( c1 | c2 | b2 |flie(ss|ß)end|verhandlungssicher|muttersprach|sehr gut|erforderlich|vorausgesetzt|zwingend)|(fluent|excellent|very good|good|strong|business|confident|native|proficient| b2 | c1 )(?:(?!plus|vorteil|wünschenswert|wuenschenswert|nice|desirable|prefer|advantag|benefic|basic|grundkenntnis|basis|optional)[\w\s]){0,40}german(?!y)(?![\w\s]{0,30}(is a plus|a plus|nice to have|desirable|preferred|beneficial|an advantage))|german(?!y)(?:(?!plus|vorteil|wünschenswert|wuenschenswert|nice|desirable|prefer|advantag|benefic|basic|grundkenntnis|basis|optional)[\w\s]){0,30}( c1 | c2 | b2 |fluent|native|mandatory|required|is a must)(?![\w\s]{0,30}(is a plus|a plus|nice to have|desirable|preferred|beneficial|an advantage))'
# Research institutes, universities and student-job boards, scanned for everyone searching in Germany (Settings ›
# Career sites, origin "pack"). page: "<list url>#re:<regex the posting links match>". Each returned postings on 2026-10-21.
# Not scannable then (job lists built by JavaScript, login or 404): KIT, TU Darmstadt, Uni Stuttgart (uses stellenwerk),
# TUHH, LUH Hannover, Max Planck, Helmholtz, FZ Jülich, DESY, HZB, DKFZ, DFKI, EURAXESS, academics.de, Interamt,
# and the job pages of LMU, Hamburg, Heidelberg, Tübingen, Ulm, Freiburg, Paderborn, Siegen, Saarland, RPTU, OTH Regensburg.
# Student-job boards checked 2026-10-21 and left out: jobmensa.de and studentjob.de (lists built by JavaScript), absolventa.de
# (its Praktikum/Abschlussarbeit lists name no employer). Student jobs come through the boards' type-word searches instead.
# types: a site scanned only for people who look for one of these job types.
career_sites:
  - {name: Fraunhofer, kind: successfactors, ref: "https://jobs.fraunhofer.de"}
  - {name: DLR, kind: successfactors, ref: "https://jobs.dlr.de"}
  - {name: karriere.nrw (RWTH and NRW universities), kind: karriere_nrw, ref: "https://api.karriere.nrw/v1.0/search/"}
  - {name: TUM (academic staff), kind: page, ref: 'https://portal.mytum.de/jobs/wissenschaftler/#re:/NewsArticle_'}
  - {name: TUM (student jobs), kind: page, ref: 'https://portal.mytum.de/schwarzesbrett/hiwi_stellen/#re:/NewsArticle_', types: [student]}
  - {name: TU Berlin, kind: page, ref: 'https://www.jobs.tu-berlin.de/stellenausschreibungen#re:/stellenausschreibungen/\d+'}
  - {name: TU Dresden, kind: page, ref: 'https://tu-dresden.de/tu-dresden/arbeiten-an-der-tud/stellenangebote/stellenangebote#re:StellAus/stelle\.asp'}
  - {name: FAU Erlangen-Nürnberg, kind: page, ref: 'https://www.jobs.fau.de/jobs/#re:/jobs/[^/]+-fau-\d+'}
  - {name: TU Braunschweig, kind: page, ref: 'https://www.tu-braunschweig.de/stellenangebote/wimi#re:/stellenangebote/wimi/.'}
  - {name: Universität Bonn, kind: page, ref: 'https://www.uni-bonn.de/de/universitaet/arbeiten-an-der-uni/stellenangebote#re:/stellenausschreibungen/.'}
  - {name: stellenwerk Hamburg, kind: page, ref: 'https://www.stellenwerk.de/hamburg/#re:stellenwerk\.de/hamburg/[a-z0-9-]{25,}$', types: [student, internship, thesis, graduate]}
  - {name: stellenwerk Berlin, kind: page, ref: 'https://www.stellenwerk.de/berlin/#re:stellenwerk\.de/berlin/[a-z0-9-]{25,}$', types: [student, internship, thesis, graduate]}
