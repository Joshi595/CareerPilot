<div x-data="practice">
  <div class="page-head">
    <div>
      <h1 x-text="t('tabs.practice')"></h1>
      <p class="small" x-text="t('practice.intro')"></p>
    </div>
  </div>

  <section class="need-sec" x-show="interviews().length">
    <h2 class="sub" x-text="t('practice.your_interviews')"></h2>
    <div class="cards two">
      <template x-for="a in interviews()" :key="a.id">
        <button type="button" class="opt-card" :aria-pressed="which === String(a.id)" :class="which === String(a.id) && 'on'" @click="choose(a.id)">
          <b x-text="a.role"></b><small x-text="a.company"></small>
          <small class="when" x-show="a.data.interview_at" x-text="a.data.interview_at && (when(a.data.interview_at) + ' · ' + countdown(a.data.interview_at))"></small>
          <small class="when" x-show="!a.data.interview_at" x-text="t('status.' + a.status)"></small>
        </button>
      </template>
    </div>
  </section>

  <div class="toolbar">
    <button class="chip" :aria-pressed="which === 'general'" @click="choose('general')" x-text="t('practice.general')"></button>
    <input type="search" list="practice-apps" x-model="find" @change="pickFind()" :placeholder="t('practice.another')" :aria-label="t('practice.another')">
    <datalist id="practice-apps"><template x-for="a in apps" :key="a.id"><option :value="label(a)"></option></template></datalist>
  </div>
  <div class="msg info busy-note" x-show="busy" role="status"><span class="spinner" aria-hidden="true"></span><span x-text="busy"></span></div>
  <div class="msg bad" x-show="err" role="alert"><span x-text="err"></span> <button class="btn sm" @click="load()" x-text="t('board.retry')"></button></div>
  <div class="list" x-show="loading" aria-busy="true" :aria-label="t('practice.loading')">
    <template x-for="n in 4" :key="n"><div class="item"><span class="skeleton sk-line"></span></div></template>
  </div>

  <!-- an application: its interview -->
  <template x-if="!loading && prep && cur()">
    <div class="stack">
      <div class="prep-head">
        <div><h2 x-text="cur().role"></h2><span class="muted" x-text="cur().company"></span></div>
        <div class="inline">
          <span class="badge interview" x-show="prep.interview_at"><svg class="i sm" aria-hidden="true"><use href="/static/icons.svg#i-calendar"/></svg>
            <span class="num" x-text="prep.interview_at && (when(prep.interview_at) + ' · ' + countdown(prep.interview_at))"></span></span>
          <a class="btn sm" x-show="prep.link" :href="prep.link" target="_blank" rel="noopener noreferrer">
            <svg class="i sm" aria-hidden="true"><use href="/static/icons.svg#i-external-link"/></svg><span x-text="t('practice.join')"></span></a>
        </div>
      </div>
      <nav :aria-label="t('practice.parts')">
        <template x-for="k in PREP_TABS" :key="k"><button :aria-pressed="tab === k" @click="tab = k; mock = null" x-text="t('practice.tab.' + k)"></button></template>
      </nav>

      <section x-show="tab === 'brief'" class="stack">
        <div class="empty" x-show="!prep.brief">
          <span x-text="t('practice.brief_none')"></span>
          <button class="btn primary" :disabled="!!busy" @click="makeBrief()" x-text="t('practice.make_brief')"></button>
        </div>
        <template x-if="prep.brief">
          <div class="panel brief stack">
            <p class="lead" x-text="prep.brief.role"></p>
            <div><h3 x-text="t('practice.wants')"></h3><ol><template x-for="w in prep.brief.wants" :key="w"><li x-text="w"></li></template></ol></div>
            <div x-show="prep.brief.gaps.length"><h3 x-text="t('practice.gaps')"></h3>
              <dl class="gaps"><template x-for="g in prep.brief.gaps" :key="g.gap"><div><dt x-text="g.gap"></dt><dd x-text="g.answer"></dd></div></template></dl></div>
            <div><h3 x-text="t('practice.ask')"></h3><ul><template x-for="q in prep.brief.ask" :key="q"><li x-text="q"></li></template></ul></div>
            <div class="actions"><button class="btn ghost sm" :disabled="!!busy" @click="makeBrief()" x-text="t('practice.refresh')"></button></div>
          </div>
        </template>
        <details class="panel sent" @toggle="$el.open && loadPosting()">
          <summary x-text="t('practice.sent')"></summary>
          <h3 x-text="t('apply.cv')"></h3>
          <p class="small muted" x-show="!prep.sent.cv.length" x-text="t('practice.sent_none')"></p>
          <ul><template x-for="l in prep.sent.cv" :key="l"><li x-text="l.replaceAll('**', '')"></li></template></ul>
          <h3 x-text="t('apply.letter')"></h3>
          <template x-for="p in prep.sent.letter" :key="p"><p x-text="p.replaceAll('**', '')"></p></template>
          <h3 x-text="t('applications.job_description')"></h3>
          <pre class="posting-text" x-text="posting === null ? t('working') : posting || t('applications.no_posting')"></pre>
        </details>
      </section>

      <section x-show="tab === 'stories'" class="stack">
        <p class="small muted" x-text="t('practice.stories_d')"></p>
        <div class="empty" x-show="!prep.brief">
          <span x-text="t('practice.stories_none')"></span>
          <button class="btn primary" :disabled="!!busy" @click="makeBrief()" x-text="t('practice.make_brief')"></button>
        </div>
        <template x-for="s in prep.brief?.stories || []" :key="s.title">
          <article class="panel story">
            <div class="rev-head"><b x-text="s.title"></b><span class="badge" x-text="s.requirement"></span></div>
            <dl class="star-story">
              <template x-for="k in ['situation', 'task', 'action', 'result']" :key="k">
                <div><dt x-text="t('practice.star.' + k)"></dt><dd x-text="s[k]"></dd></div></template>
            </dl>
          </article>
        </template>
      </section>

      <section x-show="tab === 'defend'" class="stack">
        <p class="small muted" x-text="t('practice.defend_d')"></p>
        <div class="empty" x-show="!prep.defend.length">
          <span x-text="t('practice.defend_none')"></span>
          <button class="btn primary" :disabled="!!busy" @click="makeDefend()" x-text="t('practice.make_drill')"></button>
        </div>
      </section>

      <section x-show="tab === 'questions'">
        <div class="actions"><button class="btn" :class="!qs.length && 'primary'" :disabled="!!busy" @click="generate()">
          <svg class="i sm" aria-hidden="true"><use href="/static/icons.svg#i-sparkles"/></svg>
          <span x-text="qs.length ? t('practice.new_questions') : t('practice.make_questions')"></span></button></div>
      </section>

      <section x-show="tab === 'mock'" class="stack">
        <template x-if="!mock">
          <div class="panel stack">
            <p x-text="t('practice.mock_d')"></p>
            <p class="small muted" x-show="!qs.length && !prep.defend.length" x-text="t('practice.mock_need')"></p>
            <label class="check"><input type="checkbox" class="switch" x-model="timer"><span x-text="t('practice.timer')"></span></label>
            <div><button class="btn primary" :disabled="!qs.length && !prep.defend.length" @click="startMock()" x-text="t('practice.mock_start')"></button></div>
          </div>
        </template>
        <template x-if="mock && !mock.done">
          <div class="panel stack mock">
            <div class="rev-head"><span class="small muted" x-text="t('practice.mock_of', {n: mock.i + 1, total: mock.list.length})"></span>
              <span class="badge num" x-show="timer" :class="left < 20 && 'warn'" x-text="mmss()"></span></div>
            <h3 x-text="open.question"></h3>
            <p class="small muted" x-text="open.why"></p>
            <textarea rows="7" x-model="text" :placeholder="t('practice.type_answer')" :aria-label="t('practice.type_answer')"></textarea>
            <div class="actions">
              <button class="btn primary" :disabled="!text.trim() || !!busy" @click="save(true)" x-text="t('practice.feedback')"></button>
              <button class="btn" @click="nextQ()" x-text="mock.i + 1 < mock.list.length ? t('practice.next') : t('practice.finish')"></button>
            </div>
            <template x-if="fb">
              <div class="panel inset stack feedback" aria-live="polite">
                <div class="group-head"><h3 class="sub" x-text="t('practice.feedback_title')"></h3>
                  <span class="badge" :class="fb.score >= 4 ? 'ok' : fb.score >= 3 ? 'accent' : 'warn'" x-text="t('practice.score', {n: fb.score})"></span></div>
                <div x-show="fb.improve.length"><b x-text="t('practice.improve')"></b>
                  <ul class="reqs"><template x-for="s in fb.improve" :key="s"><li class="partly">
                    <svg class="i sm" aria-hidden="true"><use href="/static/icons.svg#i-arrow-up"/></svg><span x-text="s"></span></li></template></ul></div>
                <div><b x-text="t('practice.better')"></b><blockquote class="better" x-text="fb.better"></blockquote></div>
                <div x-include="followup.html"></div>
              </div>
            </template>
          </div>
        </template>
        <template x-if="mock && mock.done">
          <div class="panel stack">
            <h3 x-text="t('practice.mock_done', {avg: average()})"></h3>
            <p class="small muted" x-show="!mockScores().length" x-text="t('practice.mock_no_scores')"></p>
            <ul class="list"><template x-for="s in mockScores().slice(0, 3)" :key="s.question">
              <li class="item"><span class="badge warn num" x-text="t('practice.score', {n: s.score})"></span><span class="grow" x-text="s.question"></span>
                <button class="btn sm" @click="again(s.question)" x-text="t('practice.again')"></button></li></template></ul>
            <div><button class="btn" @click="startMock()" x-text="t('practice.mock_start')"></button></div>
          </div>
        </template>
      </section>
    </div>
  </template>

  <template x-if="!loading && !prep">
    <div class="actions"><button class="btn" :class="!qs.length && 'primary'" :disabled="!!busy" @click="generate()">
      <svg class="i sm" aria-hidden="true"><use href="/static/icons.svg#i-sparkles"/></svg>
      <span x-text="qs.length ? t('practice.new_questions') : t('practice.make_questions')"></span></button></div>
  </template>

  <!-- the questions and the answer pane: Questions, Defend your CV, and general practice -->
  <div class="practice" x-show="!loading && (!prep || ['questions', 'defend'].includes(tab)) && list().length">
    <ul class="list q-list" :aria-label="t('practice.questions')">
      <template x-for="q in list()" :key="q.question">
        <li><button class="q-pick" :class="q.kind === 'follow' && 'follow'" :aria-current="open?.question === q.question ? 'true' : null" @click="openQ(q)">
          <span x-text="q.question"></span>
          <span class="job-why">
            <span class="badge" x-text="t('practice.kind.' + q.kind)"></span>
            <span class="badge ok" x-show="answers[q.question]">
              <svg class="i sm" aria-hidden="true"><use href="/static/icons.svg#i-check"/></svg>
              <span x-text="answers[q.question]?.feedback ? t('practice.score', {n: answers[q.question].feedback.score}) : t('practice.answered')"></span></span>
          </span>
        </button></li>
      </template>
    </ul>
    <template x-if="open && list().some(q => q.question === open.question)">
      <section class="panel stack answer-pane">
        <h2 class="sub" x-text="open.question"></h2>
        <dl class="facts small">
          <dt x-text="t('practice.why')"></dt><dd x-text="open.why"></dd>
          <dt x-text="t('practice.facts')"></dt><dd x-text="open.facts"></dd>
        </dl>
        <textarea x-model="text" rows="8" :placeholder="t('practice.type_answer')" :aria-label="t('practice.type_answer')"></textarea>
        <div class="actions">
          <button class="btn primary" :disabled="!text.trim() || !!busy" @click="save(true)" x-text="t('practice.feedback')"></button>
          <button class="btn" :disabled="!text.trim()" @click="save(false)" x-text="t('save')"></button>
        </div>
        <template x-if="fb">
          <div class="panel inset stack feedback" aria-live="polite">
            <div class="group-head"><h3 class="sub" x-text="t('practice.feedback_title')"></h3>
              <span class="badge" :class="fb.score >= 4 ? 'ok' : fb.score >= 3 ? 'accent' : 'warn'" x-text="t('practice.score', {n: fb.score})"></span></div>
            <div x-show="fb.strengths.length"><b x-text="t('practice.good')"></b>
              <ul class="reqs"><template x-for="s in fb.strengths" :key="s"><li class="yes">
                <svg class="i sm" aria-hidden="true"><use href="/static/icons.svg#i-check"/></svg><span x-text="s"></span></li></template></ul></div>
            <div x-show="fb.improve.length"><b x-text="t('practice.improve')"></b>
              <ul class="reqs"><template x-for="s in fb.improve" :key="s"><li class="partly">
                <svg class="i sm" aria-hidden="true"><use href="/static/icons.svg#i-arrow-up"/></svg><span x-text="s"></span></li></template></ul></div>
            <div><b x-text="t('practice.better')"></b><blockquote class="better" x-text="fb.better"></blockquote></div>
            <div x-include="followup.html"></div>
          </div>
        </template>
      </section>
    </template>
  </div>
  <div class="empty" x-show="!loading && !busy && !list().length && (!prep || tab === 'questions')">
    <svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-message-square"/></svg>
    <span x-text="t('practice.empty')"></span>
  </div>
</div>
