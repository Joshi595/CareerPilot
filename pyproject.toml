[project]
name = "jobgambit"
version = "0.16.1"
description = "Find jobs and tailor your CV and cover letter with the AI plan you already have. Runs on your own computer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typst>=0.13",
    "ruamel-yaml>=0.18",
    "babel>=2.16",
    "trafilatura>=2.0",
    "pypdf>=5",
    "python-jobspy>=1.1.80",
    "curl-cffi>=0.7",  # browser-like connections for sites that stall anything else (sources.BROWSER_ONLY)
    "rapidfuzz>=3",
    "dateparser>=1.2",
    "langdetect>=1.0.9",
    "geonamescache>=2",
    "keyring>=25",
    "apprise>=1.9",
]

[project.scripts]
jobgambit = "jobgambit.app.server:main"

[project.gui-scripts]
jobgambit-app = "jobgambit.app.server:main"

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
