name: release
on:
  push:
    tags: ["v*"]
jobs:
  pypi:  # trusted publishing: set up the "jobgambit" project on pypi.org for this repository first
    # PyPI is public: nothing is published until the repository variable PUBLISH_PYPI is "true" (when going public)
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1 (attestations on by default)
